# Junior College edition: its OWN Supabase project. Never link this folder to the engineering
# project. Ports use the 554xx range so both editions' local stacks can run side by side.
project_id = "jr-college-attendance"

[api]
enabled = true
port = 55421
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55422
shadow_port = 55420
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed/dev.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 55423
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 55424

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/confirm"]
# 15-minute access tokens: role and deactivation changes take effect quickly (web doc §6.5).
jwt_expiry = 900
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# No public sign-up: every account is issued by the college office (web doc §7).
enable_signup = false

# Mirror these in the hosted project: Authentication → Policies / Providers.
minimum_password_length = 10
password_requirements = "lower_upper_letters_digits"

[auth.email]
enable_signup = false
enable_confirmations = false
secure_password_change = true

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"

[analytics]
enabled = false
