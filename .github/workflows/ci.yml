name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
      # Build-time placeholders only; real values live in Vercel.
      NEXT_PUBLIC_JR_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_JR_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      NEXT_PUBLIC_SITE_URL: https://example.org
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Database engine (all migrations in PGlite)
        run: npm run test:db
      - run: npm run build
